<!doctype html><html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; connect-src 'none'">
<style>
html,body{margin:0;width:100%;height:680px;background:#060d1b;overflow:hidden;font-family:system-ui,sans-serif;color:#b9d6e8}
#globe{width:100%;height:100%}#status{position:absolute;bottom:12px;left:16px;font-size:11px;pointer-events:none}
.marker{font-size:10px;line-height:12px;color:#ffffff;white-space:nowrap;cursor:pointer;pointer-events:auto;text-shadow:0 1px 3px #000,0 0 3px #000}
#reset{position:absolute;top:12px;right:12px;z-index:5;background:#11243b;color:#b6f4ff;border:1px solid #42658a;border-radius:5px;padding:6px 10px;cursor:pointer;font-size:11px}
#selection{position:absolute;top:14px;left:16px;z-index:4;font-size:11px;background:#11243b;padding:6px 10px;border-radius:5px;pointer-events:none}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:#FF0000;box-shadow:0 0 5px rgba(255,0,0,0.65);margin-right:6px;vertical-align:middle}
</style></head><body><div id="globe"></div><button id="reset" type="button">Reset Globe</button><div id="selection" role="status" hidden></div><div id="status">Loading nighttime Earth…</div>
<script>__GLOBE_SCRIPT__</script>
<script type="application/json" id="marker-data">__MARKERS__</script>
<script>
const data=JSON.parse(document.getElementById('marker-data').textContent);
const status=document.getElementById('status');
const escapeHtml=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
try {
 const globe=new Globe(document.getElementById('globe'),{animateIn:false,rendererConfig:{antialias:true,alpha:false}})
  .backgroundColor('#060d1b').width(innerWidth).height(680)
  .globeImageUrl('data:image/jpeg;base64,__TEXTURE__')
  .showAtmosphere(true).atmosphereColor('#4e95bf').atmosphereAltitude(0.12)
  .pointsData(data).pointLat('lat').pointLng('lng').pointColor(()=>'#FF0000')
  .pointRadius(0.48).pointAltitude(0.008).pointsTransitionDuration(0)
  .pointLabel(d=>`${escapeHtml(d.country)}<br>Synthetic participants: ${d.count}`)
  .htmlElementsData(data).htmlLat('lat').htmlLng('lng').htmlAltitude(0.015)
  .htmlElement(d=>{
    const el=document.createElement('div');el.className='marker';
    const dot=document.createElement('span');dot.className='dot';el.append(dot,document.createTextNode(String(d.count)));
    el.title=`${d.country}: ${d.count} synthetic participants`;
    el.setAttribute('role','button');el.tabIndex=0;
    el.setAttribute('aria-label',`Zoom to ${d.country}: ${d.count} synthetic participants`);
    el.addEventListener('click',event=>{event.stopPropagation();focusCountry(d);});
    el.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();focusCountry(d);}});
    const left=d.position.includes('left');const bottom=d.position.includes('bottom');
    el.style.transform=`translate(${left?'-110%':'12px'},${bottom?'10px':'-22px'})`;
    return el;
  });
 const controls=globe.controls();controls.autoRotate=false;controls.enableDamping=false;
 controls.enableRotate=true;controls.enableZoom=true;controls.enablePan=false;
 let defaultAltitude,minAltitude;
 const selection=document.getElementById('selection');
 function fitCamera(){
   const width=document.getElementById('globe').clientWidth,height=680;
   globe.width(width).height(height);
   const radius=globe.getGlobeRadius(),focal=height/(2*Math.tan(globe.camera().fov*Math.PI/360));
   const distance=diameter=>radius*Math.sqrt(1+(2*focal/diameter)**2);
   // Fit the real sphere through camera distance; reserve space for atmosphere.
   defaultAltitude=distance(.83*Math.min(width,height))/radius-1;
   controls.minDistance=distance(.89*Math.min(width,height));
   controls.maxDistance=Math.max(650,controls.minDistance*2);
   minAltitude=controls.minDistance/radius-1;
   window.defaultView={lat:22,lng:40,altitude:defaultAltitude};
   resetView(0);
 }
 function resetView(duration=1000){selection.hidden=true;globe.pointOfView(window.defaultView,duration);}
 function focusCountry(d){
   selection.textContent=`${d.country} · ${d.count} synthetic participants`;selection.hidden=false;
   globe.pointOfView({lat:d.lat,lng:d.lng,altitude:Math.max(minAltitude,defaultAltitude*.85)},1000);
 }
 globe.onPointClick(d=>focusCountry(d));
 document.getElementById('reset').addEventListener('click',()=>resetView());
 const canvas=globe.renderer().domElement;
 let press=null,lastWheel=-Infinity;
 canvas.addEventListener('pointerdown',event=>{if(event.isPrimary&&event.button===0)press={x:event.clientX,y:event.clientY,id:event.pointerId,moved:false};});
 canvas.addEventListener('pointermove',event=>{if(press&&Math.hypot(event.clientX-press.x,event.clientY-press.y)>5)press.moved=true;});
 canvas.addEventListener('wheel',()=>{lastWheel=performance.now();press=null;},{passive:true});
 canvas.addEventListener('pointercancel',()=>{press=null;});
 canvas.addEventListener('pointerup',event=>{
   const start=press;press=null;
   if(!start||event.pointerId!==start.id||start.moved||performance.now()-lastWheel<250)return;
   const rect=canvas.getBoundingClientRect();
   // Globe.GL performs the Three.js sphere intersection for these pixels.
   if(globe.toGlobeCoords(event.clientX-rect.left,event.clientY-rect.top)===null)resetView();
 });
 fitCamera();
 globe.renderer().setPixelRatio(Math.min(devicePixelRatio,1.5));
 globe.onGlobeReady(()=>{window.globeReady=true;status.textContent='Synthetic counts · Drag to rotate · Scroll to zoom';});
 window.globe=globe;window.markerData=data;
 let previousWidth=innerWidth;
 new ResizeObserver(()=>{const width=document.body.clientWidth;if(width!==previousWidth){previousWidth=width;fitCamera();}}).observe(document.body);
 document.addEventListener('visibilitychange',()=>document.hidden?globe.pauseAnimation():globe.resumeAnimation());
 window.addEventListener('pagehide',()=>{globe.pauseAnimation();globe._destructor();});
} catch(error) {status.textContent='3D globe unavailable: WebGL support is required.';window.globeError=String(error);}
</script></body></html>
